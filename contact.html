<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
   <link rel="stylesheet" href="./index.html">
  <link rel="stylesheet" href="./product.html">
  <link rel="stylesheet" href="./about.html">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
   <div class="container">
      <nav class="navbar sticky-top bg-body-tertiary" style="background-color: #e3f2fd;" data-bs-theme="light">
        <div class="container-fluid">
          <a class="navbar-brand, link-info" href="./product.html" target="_blank">Product</a>
          <a class="navbar-brand, link-info" href="./index.html" target="_blank">Home</a>
          <a class="navbar-brand, link-info" href="./about.html" target="_blank">About</a>
        </div>
  </head>
</head>
<body>
  <div class="alert alert-danger " position="center" role="alert">
  In need assistance? 
</div>
  <div >
    <h1>Contact Page</h1>
    <form action="/submit-form" method="POST">
     <label for="name">Full name and surname: </label>
     <input type="text" id="name" name="name"><br><br>
     <label for="email">Contact email address: </label>
     <input type="text" id="email" name="Email"><br><br>
     <label for="phone">Personal phone number: </label>
     <input type="text" id="phone" name="phone number"><br><br>
     <label for="subject">Reason/subject for contact: </label> 
     <select id="subject" name="subject">
       <option value="nothing">None</option>
       <option value="general">General inquiry of products</option>
       <option value="support">Ways to support our business</option>
       <option value="feedback">Feedback</option>
       <option value="customer">Customer support</option>
       <option value="other">Other</option><br><br>
     </select><br>
    <p><label for="message">Input your reason for contact:</label></p>
      <textarea id="Message" name="Feedback" rows="5" cols="50" maxlength="1500"></textarea><br>
    <button type="submit" class="btn btn-primary" id="liveToastBtn">Submit</button>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="liveToast" class="toast" role="alert"
      aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
          Delivered successfully! We will get back to you shortly.
        </div>
  </div>
</div>
   </form>
  </div>
</body>
</html>
